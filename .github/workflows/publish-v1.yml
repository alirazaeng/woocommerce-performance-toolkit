name: Publish v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.yml'

permissions:
  contents: write

jobs:
  release:
    name: Publish v1.0.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release archive
        run: |
          mkdir -p release/woocommerce-performance-toolkit
          cp -R php js css docs examples case-studies assets release/woocommerce-performance-toolkit/
          cp README.md CHANGELOG.md RELEASE_NOTES.md LICENSE SECURITY.md composer.json phpcs.xml.dist release/woocommerce-performance-toolkit/
          cd release
          zip -r ../woocommerce-performance-toolkit-v1.0.0.zip woocommerce-performance-toolkit

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; nothing to publish."
            exit 0
          fi

          gh release create v1.0.0             --target "$GITHUB_SHA"             --title "v1.0.0 — First Stable Release"             --notes-file RELEASE_NOTES.md             --latest             woocommerce-performance-toolkit-v1.0.0.zip
